name: subscription-service

services:
  postgres:
    # The single source of the database image; the integration
    # tests read it from here.
    image: postgres:17.12-alpine3.24
    env_file:
      - path: .env.example
      - path: .env
        required: false
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP, not the Unix socket: on first start the image runs a temporary
      # server on the socket only, which pg_isready reports ready just before it
      # shuts down (verified).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      # These variables have two roles: the host values for `make db` and
      # `make run`, and the in-network ones. A developer's .env may change the
      # first; these keep the app on the database service and on the port that
      # is published and health-checked.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      HTTP_ADDR: ":8080"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Loopback only: a published port is open on every interface and bypasses
      # the host firewall, and a reviewer needs only localhost.
      # APP_PORT moves the host side when 8080 is taken; Compose reads it from
      # the shell or .env, never from env_file.
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    # docker compose stop sends SIGTERM, then kills after the grace period
    # (10 s by default). It must cover the 10 s shutdown timeout plus closing
    # the pool.
    stop_grace_period: 15s

volumes:
  pgdata:
