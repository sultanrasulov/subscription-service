name: subscription-service

services:
  postgres:
    # The single source of the database image (design §10.5); the integration
    # tests read it from here.
    image: postgres:17.12-alpine3.24
    env_file:
      - path: .env.example
      - path: .env
        required: false
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP, not the Unix socket: on first start the image runs a temporary
      # server on the socket only, which pg_isready reports ready just before it
      # shuts down (verified).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
