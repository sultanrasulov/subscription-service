version: "2"

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    # Correctness and safety.
    - bodyclose
    - errorlint
    - exhaustive
    - gosec
    - nilerr
    - noctx
    - unparam
    # Architecture and project conventions.
    - depguard
    - nolintlint
    - sloglint
    # Readability and maintainability.
    - gocognit
    - goconst
    - gocritic
    - godot
    - misspell
    - nakedret
    - revive
    - unconvert
    - whitespace
  settings:
    errcheck:
      # An unchecked type assertion panics; make it an explicit choice.
      check-type-assertions: true
    exhaustive:
      # A default case is a deliberate "everything else" branch.
      default-signifies-exhaustive: true
    gocognit:
      min-complexity: 20
    goconst:
      # Table-test literals read better inline than as constants.
      ignore-tests: true
    misspell:
      locale: US
    nolintlint:
      # Every //nolint names the linter and says why.
      require-explanation: true
      require-specific: true
    sloglint:
      # Only the *Context methods, so request_id is attached.
      context: all
    depguard:
      # One rule per layer: what the layer must not import, so dependencies point
      # inward and platform stays domain-neutral.
      rules:
        domain:
          files: ["**/internal/subscription/domain/**"]
          # The domain depends only on the standard library, a UUID library and the
          # shared value objects, so anything else is rejected; deny still wins for
          # the standard packages it names.
          list-mode: strict
          allow:
            - $gostd
            - github.com/google/uuid
            - github.com/sultanrasulov/subscription-service/internal/shared/
            # The external test package imports the package it tests. The
            # trailing $ makes this an exact match, so a subpackage still needs
            # its own decision.
            - github.com/sultanrasulov/subscription-service/internal/subscription/domain$
          deny:
            - pkg: net/http
              desc: the domain knows nothing about HTTP
            - pkg: encoding/json
              desc: serialization lives in adapters
            - pkg: database/sql
              desc: the domain knows nothing about SQL
            - pkg: github.com/jackc/pgx
              desc: the domain knows nothing about SQL
            - pkg: github.com/sultanrasulov/subscription-service/internal/subscription/application
              desc: dependencies point inward
            - pkg: github.com/sultanrasulov/subscription-service/internal/subscription/adapters
              desc: dependencies point inward
            - pkg: github.com/sultanrasulov/subscription-service/internal/platform
              desc: the domain does not depend on platform
        application:
          files: ["**/internal/subscription/application/**"]
          deny:
            - pkg: net/http
              desc: HTTP lives in adapters/httpapi
            - pkg: encoding/json
              desc: serialization lives in adapters
            - pkg: database/sql
              desc: SQL lives in adapters/postgres
            - pkg: github.com/jackc/pgx
              desc: SQL lives in adapters/postgres
            - pkg: github.com/sultanrasulov/subscription-service/internal/subscription/adapters
              desc: dependencies point inward
            - pkg: github.com/sultanrasulov/subscription-service/internal/platform
              desc: the application does not depend on platform
            - pkg: github.com/sultanrasulov/subscription-service/internal/shared
              desc: identifiers are created through the domain's constructors
        httpapi:
          files: ["**/internal/subscription/adapters/httpapi/**"]
          deny:
            - pkg: github.com/sultanrasulov/subscription-service/internal/subscription/adapters/postgres
              desc: adapters do not know each other
            - pkg: database/sql
              desc: SQL lives in adapters/postgres
            - pkg: github.com/jackc/pgx
              desc: SQL lives in adapters/postgres
            - pkg: github.com/sultanrasulov/subscription-service/internal/shared
              desc: identifiers are created through the domain's constructors
        postgres-adapter:
          files: ["**/internal/subscription/adapters/postgres/**"]
          deny:
            - pkg: github.com/sultanrasulov/subscription-service/internal/subscription/adapters/httpapi
              desc: adapters do not know each other
            - pkg: net/http
              desc: HTTP lives in adapters/httpapi
            - pkg: github.com/sultanrasulov/subscription-service/internal/shared
              desc: identifiers are created through the domain's constructors
        platform:
          files: ["**/internal/platform/**"]
          deny:
            - pkg: github.com/sultanrasulov/subscription-service/internal/subscription
              desc: platform is domain-neutral
            - pkg: github.com/sultanrasulov/subscription-service/internal/shared
              desc: platform is domain-neutral
        shared:
          files: ["**/internal/shared/**"]
          # Shared value objects are domain code that every bounded context may
          # use, so they are as pure as a domain: the standard library, a UUID
          # library and one another. Anything else is rejected, including every
          # bounded context and platform.
          list-mode: strict
          allow:
            - $gostd
            - github.com/google/uuid
            - github.com/sultanrasulov/subscription-service/internal/shared/
          deny:
            - pkg: net/http
              desc: shared value objects know nothing about HTTP
            - pkg: encoding/json
              desc: serialization lives in adapters
            - pkg: database/sql
              desc: shared value objects know nothing about SQL
  exclusions:
    rules:
      # Tests use fixed timeouts, test servers, requests without a context,
      # long table-driven functions and helpers with constant arguments.
      - path: _test\.go
        linters: [gosec, noctx, gocognit, unparam]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sultanrasulov/subscription-service

issues:
  # Report every issue; the defaults (50 per linter, 3 identical) hide some.
  max-issues-per-linter: 0
  max-same-issues: 0
  # One line can carry several findings; by default only the first is shown.
  uniq-by-line: false
