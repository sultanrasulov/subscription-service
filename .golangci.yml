version: "2"

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    # Correctness and safety.
    - bodyclose
    - errorlint
    - exhaustive
    - gosec
    - nilerr
    - noctx
    - unparam
    # Architecture and project conventions.
    - depguard
    - nolintlint
    - sloglint
    # Readability and maintainability.
    - gocognit
    - goconst
    - gocritic
    - godot
    - misspell
    - nakedret
    - revive
    - unconvert
    - whitespace
  settings:
    errcheck:
      # An unchecked type assertion panics; make it an explicit choice.
      check-type-assertions: true
    exhaustive:
      # A default case is a deliberate "everything else" branch.
      default-signifies-exhaustive: true
    gocognit:
      min-complexity: 20
    goconst:
      # Table-test literals read better inline than as constants.
      ignore-tests: true
    misspell:
      locale: US
    nolintlint:
      # Every //nolint names the linter and says why (CLAUDE.md, Principles).
      require-explanation: true
      require-specific: true
    sloglint:
      # Only the *Context methods, so request_id is attached (CLAUDE.md, Conventions).
      context: all
    depguard:
      # One rule per row of the dependency table in design §3.2.
      rules:
        domain:
          files: ["**/internal/subscription/domain/**"]
          # The domain depends only on the standard library and a UUID library (design §3.2),
          # so anything else is rejected; deny still wins for the standard packages it names.
          list-mode: strict
          allow:
            - $gostd
            - github.com/google/uuid
          deny:
            - pkg: net/http
              desc: the domain knows nothing about HTTP (design §3.2)
            - pkg: encoding/json
              desc: serialization lives in adapters (design §3.2)
            - pkg: database/sql
              desc: the domain knows nothing about SQL (design §3.2)
            - pkg: github.com/jackc/pgx
              desc: the domain knows nothing about SQL (design §3.2)
            - pkg: github.com/sultanrasulov/subscription-service/internal/subscription/application
              desc: dependencies point inward (design §3.2)
            - pkg: github.com/sultanrasulov/subscription-service/internal/subscription/adapters
              desc: dependencies point inward (design §3.2)
            - pkg: github.com/sultanrasulov/subscription-service/internal/platform
              desc: the domain does not depend on platform (design §3.2)
        application:
          files: ["**/internal/subscription/application/**"]
          deny:
            - pkg: net/http
              desc: HTTP lives in adapters/httpapi (design §3.2)
            - pkg: encoding/json
              desc: serialization lives in adapters (design §3.2)
            - pkg: database/sql
              desc: SQL lives in adapters/postgres (design §3.2)
            - pkg: github.com/jackc/pgx
              desc: SQL lives in adapters/postgres (design §3.2)
            - pkg: github.com/sultanrasulov/subscription-service/internal/subscription/adapters
              desc: dependencies point inward (design §3.2)
            - pkg: github.com/sultanrasulov/subscription-service/internal/platform
              desc: the application does not depend on platform (design §3.2)
        httpapi:
          files: ["**/internal/subscription/adapters/httpapi/**"]
          deny:
            - pkg: github.com/sultanrasulov/subscription-service/internal/subscription/adapters/postgres
              desc: adapters do not know each other (design §3.2)
            - pkg: database/sql
              desc: SQL lives in adapters/postgres (design §3.2)
            - pkg: github.com/jackc/pgx
              desc: SQL lives in adapters/postgres (design §3.2)
        postgres-adapter:
          files: ["**/internal/subscription/adapters/postgres/**"]
          deny:
            - pkg: github.com/sultanrasulov/subscription-service/internal/subscription/adapters/httpapi
              desc: adapters do not know each other (design §3.2)
            - pkg: net/http
              desc: HTTP lives in adapters/httpapi (design §3.2)
        platform:
          files: ["**/internal/platform/**"]
          deny:
            - pkg: github.com/sultanrasulov/subscription-service/internal/subscription
              desc: platform is domain-neutral (design §3.2)
  exclusions:
    rules:
      # Tests use fixed timeouts, test servers, requests without a context,
      # long table-driven functions and helpers with constant arguments.
      - path: _test\.go
        linters: [gosec, noctx, gocognit, unparam]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sultanrasulov/subscription-service

issues:
  # Report every issue; the defaults (50 per linter, 3 identical) hide some.
  max-issues-per-linter: 0
  max-same-issues: 0
  # One line can carry several findings; by default only the first is shown.
  uniq-by-line: false
