version: 2

# Weekly updates for every file that holds a version. Minor and patch updates
# come as one grouped pull request per ecosystem; majors come one by one. The
# commit messages are chore(deps): …, set explicitly, because Dependabot would
# otherwise guess a prefix from the history.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      gomod:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  # The Dockerfile's images. A golang update stays red until the toolchain line
  # in go.mod is bumped in the same pull request; Dependabot does not bump it.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  # compose.yaml's database image. A Postgres major needs pg_upgrade for the
  # data volume and a decision, so it is never proposed automatically.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]
    groups:
      docker-compose:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  # .pre-commit-config.yaml's hook repositories, pinned by SHA with a frozen
  # comment that Dependabot updates together with the SHA.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      pre-commit:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
